<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunBlue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f0f0; max-width: 480px; margin: 0 auto; padding-bottom: 76px; }

    /* Header */
    .header { background: white; padding: 16px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 20px; font-weight: 600; color: #185FA5; }
    .header .date { font-size: 13px; color: #888; margin-top: 2px; }
    .header .pct { font-size: 13px; color: #185FA5; font-weight: 500; margin-top: 4px; }

    /* Navigation bas */
    .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #e0e0e0; display: flex; z-index: 20; }
    .nav-btn { flex: 1; padding: 10px 0; font-size: 11px; color: #888; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-btn.active { color: #185FA5; font-weight: 500; }
    .nav-icon { font-size: 18px; }

    /* Vues */
    .vue { display: none; padding: 12px; }
    .vue.active { display: block; }

    /* Bouton connexion */
    .connexion-zone { padding: 0 12px; }
    .btn-connexion { display: block; margin: 16px 0; padding: 12px; background: #185FA5; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; }

    /* Menus */
    .menu-card { background: white; border: 1px solid #e8e8e8; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
    .menu-titre { font-size: 12px; font-weight: 600; color: #185FA5; margin-bottom: 6px; }
    .menu-ligne { display: flex; gap: 10px; font-size: 14px; color: #222; padding: 3px 0; }
    .menu-moment { width: 44px; flex-shrink: 0; color: #888; font-size: 12px; padding-top: 2px; }
    .menu-vide { color: #bbb; }
    .menu-jour { font-size: 11px; font-weight: 600; color: #444; text-transform: uppercase; letter-spacing: 0.5px; margin: 6px 0 2px; }
    .menu-sep { height: 1px; background: #eee; margin: 8px 0; }

    /* Tâches */
    .tache { background: white; border-radius: 10px; margin-bottom: 8px; padding: 14px 12px; display: flex; align-items: center; gap: 12px; border: 1px solid #e8e8e8; }
    .tache:active { background: #f5f5f5; }
    .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ccc; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; cursor: pointer; }
    .check.done { background: #185FA5; border-color: #185FA5; }
    .check.done::after { content: '✓'; color: white; font-size: 14px; }
    .tache-info { flex: 1; min-width: 0; }
    .tache-nom { font-size: 15px; color: #222; word-wrap: break-word; }
    .tache-nom.done { text-decoration: line-through; color: #aaa; }
    .tache-note { font-size: 11px; color: #aaa; margin-top: 2px; font-style: italic; }
    .vide { text-align: center; color: #aaa; font-size: 14px; padding: 32px; }
    .qte { color: #888; font-size: 13px; margin-left: 4px; }

    /* Sélecteur de jour */
    .jours { display: flex; overflow-x: auto; gap: 8px; padding: 4px 0 12px; scrollbar-width: none; }
    .jours::-webkit-scrollbar { display: none; }
    .jour-btn { min-width: 36px; height: 36px; border-radius: 50%; border: 1px solid #e0e0e0; background: white; font-size: 13px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .jour-btn.active { background: #185FA5; color: white; border-color: #185FA5; }
    .jour-btn.today { border-color: #185FA5; color: #185FA5; font-weight: 600; }
    .jour-btn.today.active { color: white; }

    /* Tâche gestion */
    .tache-gestion { background: white; border-radius: 10px; margin-bottom: 8px; padding: 12px; border: 1px solid #e8e8e8; }
    .tache-gestion.auto { background: #f6f9fd; }
    .tache-gestion-top { display: flex; align-items: center; justify-content: space-between; }
    .tache-gestion-nom { font-size: 15px; color: #222; flex: 1; }
    .tache-gestion-note { font-size: 11px; color: #aaa; margin-top: 2px; font-style: italic; }
    .tache-actions { display: flex; gap: 8px; margin-left: 8px; }
    .btn-edit { background: #e8f0fe; color: #185FA5; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .btn-del { background: #fce8e6; color: #c5221f; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .auto-info { font-size: 11px; color: #185FA5; background: #e8f0fe; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
    .tag-auto { display: inline-block; font-size: 10px; color: #185FA5; background: #e8f0fe; border-radius: 10px; padding: 2px 8px; margin-left: 6px; }

    /* Boutons icône */
    .btn-ic { background: none; border: none; font-size: 15px; padding: 6px; cursor: pointer; color: #999; flex-shrink: 0; }
    .btn-ic.del { color: #d99a97; }

    /* Formulaire ajout/modif */
    .formulaire { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; border: 1px solid #e8e8e8; }
    .formulaire h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #222; }
    .champ { margin-bottom: 10px; }
    .champ label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
    .champ input, .champ select { width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; background: #fafafa; }
    .champ input:focus, .champ select:focus { outline: none; border-color: #185FA5; }
    .form-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-save { flex: 1; padding: 10px; background: #185FA5; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn-cancel { padding: 10px 16px; background: #f0f0f0; color: #555; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }

    /* Bouton ajouter */
    .btn-ajouter { width: 100%; padding: 12px; background: white; color: #185FA5; border: 2px dashed #185FA5; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 4px; }
    .btn-secondaire { width: 100%; padding: 10px; background: #f0f0f0; color: #555; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; margin-top: 8px; }

    /* Badges catégorie */
    .badge { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 10px; color: white; margin-top: 3px; }
    .badge-Me { background: #185FA5; }
    .badge-Luna { background: #E8760A; }
    .badge-House { background: #1A7F5A; }
    .badge-Job { background: #6B3FA0; }
    .badge-Study { background: #0891B2; }
    .badge-Sport { background: #059669; }
    .badge-Friends { background: #B5338A; }
    .badge-Family { background: #B45309; }
    .badge-Administratif { background: #555555; }

    /* Groupe catégorie */
    .groupe-titre { font-size: 12px; font-weight: 600; color: white; padding: 4px 10px; border-radius: 8px; margin: 12px 0 6px; display: inline-block; }

    /* Courses */
    .resume { font-size: 13px; color: #888; margin-bottom: 4px; }

    /* Projets */
    .seg { display: flex; background: #e2e2e2; border-radius: 10px; padding: 3px; margin-bottom: 12px; }
    .seg button { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 8px; font-size: 13px; color: #666; cursor: pointer; }
    .seg button.active { background: white; color: #185FA5; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .projet-card { background: white; border: 1px solid #e8e8e8; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .projet-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .projet-nom { font-size: 16px; font-weight: 600; color: #222; }
    .progress { height: 8px; background: #e6edf7; border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
    .progress > div { height: 100%; background: #185FA5; border-radius: 6px; transition: width 0.3s; }
    .progress-txt { font-size: 11px; color: #888; margin-bottom: 4px; }
    .sous-tache { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #f0f0f0; }
    .chip { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: #eef3fb; color: #185FA5; display: inline-block; margin-top: 3px; margin-right: 4px; }
    .chip.retard { background: #fce8e6; color: #c5221f; }
    .chip.today { background: #185FA5; color: white; }
    .jour-titre { font-size: 13px; font-weight: 600; color: #444; margin: 14px 0 6px; }
    .jour-titre.retard { color: #c5221f; }
    .btn-mini { background: #e8f0fe; color: #185FA5; border: none; border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }

    /* ── PLATEAU RÉTRO ── */
    .plateau-vue { padding: 12px; }
    .retro-wrap { font-family: 'Press Start 2P', monospace; background: #1a1a2e; border-radius: 12px; padding: 16px; color: #e0e8ff; position: relative; overflow: hidden; }
    .retro-header-block { text-align: center; margin-bottom: 14px; }
    .retro-title { font-size: 11px; color: #4a9fd4; letter-spacing: 2px; margin-bottom: 8px; }
    .retro-score { font-size: 28px; color: #f5a623; }
    .retro-sub { font-size: 7px; color: #7a8aaa; margin-top: 6px; }
    .retro-next { font-size: 7px; color: #39d353; margin-top: 6px; }

    .month-toggle { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
    .month-btn { font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 6px 12px; border: 2px solid #2a3a5a; background: #16213e; color: #7a8aaa; border-radius: 4px; cursor: pointer; }
    .month-btn.active { border-color: #4a9fd4; color: #4a9fd4; background: rgba(74,159,212,0.1); }

    .grid-wrap { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
    .pcase { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 6px; font-family: 'Press Start 2P', monospace; border: 2px solid transparent; }
    .pcase.c1 { background: #1a3a6e; color: #4a7abf; border-color: #1e4a8a; }
    .pcase.c2 { background: #0d2b55; color: #2a5a9f; border-color: #0a2040; }
    .pcase.pdone { background: #2a2a3a; border-color: #3a3a4a; color: #4a4a6a; }
    .pcase.palier { background: #ffffff; border-color: #cccccc; color: #1a1a2e; }
    .pcase.palier.pdone { background: #7c3aed; border-color: #9f67fa; color: #ede9fe; }
    .pcase.current { background: #185FA5; border-color: #4a9fd4; color: white; font-size: 10px; animation: ppulse 1.2s ease-in-out infinite; }
    .pcase.current.palier { background: #185FA5; border-color: #4a9fd4; color: white; }
    .pcase.pempty { background: transparent; border-color: transparent; }
    @keyframes ppulse { 0%,100% { box-shadow: 0 0 0 0px rgba(74,159,212,0.6); } 50% { box-shadow: 0 0 0 5px rgba(74,159,212,0.12); } }

    .palier-cards { margin-top: 16px; }
    .palier-card { background: #16213e; border: 2px solid #2a3a5a; border-radius: 6px; padding: 12px; margin-bottom: 8px; }
    .palier-card.unlocked { border-color: #7c3aed; }
    .palier-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .palier-badge { font-size: 7px; padding: 4px 8px; border-radius: 3px; background: #f5f5f5; color: #1a1a2e; border: 1px solid #ccc; white-space: nowrap; font-family: 'Press Start 2P', monospace; }
    .palier-badge.unlocked { background: #7c3aed; color: #ede9fe; border-color: #9f67fa; }
    .palier-card-title { font-size: 7px; color: #7a8aaa; font-family: 'Press Start 2P', monospace; }
    .palier-reward { font-size: 8px; color: #e0e8ff; margin-top: 4px; font-family: 'Press Start 2P', monospace; }
    .reward-input { font-family: 'Press Start 2P', monospace; font-size: 7px; width: 100%; padding: 6px 8px; background: #1a1a2e; border: 1px solid #2a3a5a; border-radius: 3px; color: #e0e8ff; margin-top: 6px; outline: none; }
    .reward-input:focus { border-color: #4a9fd4; }
    .reward-input::placeholder { color: #7a8aaa; }
    .btn-save-reward { font-family: 'Press Start 2P', monospace; font-size: 7px; margin-top: 6px; padding: 6px 10px; background: #185FA5; border: none; border-radius: 3px; color: white; cursor: pointer; }
    .save-ok { font-size: 7px; color: #39d353; margin-top: 4px; display: none; font-family: 'Press Start 2P', monospace; }

    .confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .popup-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 20; background: rgba(10,10,30,0.75); }
    .popup-box { background: #16213e; border: 3px solid #7c3aed; border-radius: 8px; padding: 24px 20px; text-align: center; max-width: 260px; animation: popin 0.3s ease; }
    @keyframes popin { from { transform: scale(0.7); opacity:0; } to { transform: scale(1); opacity:1; } }
    .popup-fighting { font-size: 16px; color: #9f67fa; letter-spacing: 2px; margin-bottom: 12px; animation: flicker 0.8s ease-in-out infinite alternate; font-family: 'Press Start 2P', monospace; }
    @keyframes flicker { from { opacity:1; } to { opacity:0.6; } }
    .popup-palier { font-size: 8px; color: #39d353; margin-bottom: 8px; font-family: 'Press Start 2P', monospace; }
    .popup-reward { font-size: 8px; color: #e0e8ff; margin-bottom: 16px; min-height: 16px; font-family: 'Press Start 2P', monospace; }
    .popup-close { font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 8px 16px; background: #7c3aed; color: #ede9fe; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>RunBlue</h1>
    <div class="date" id="header-date">Chargement...</div>
    <div class="pct" id="header-pct"></div>
  </div>

  <div class="connexion-zone">
    <button class="btn-connexion" onclick="connexion()" id="btn-co" style="display:none">
      Se connecter avec Google
    </button>
  </div>

  <!-- Vue Aujourd'hui -->
  <div class="vue active" id="vue-aujourd-hui">
    <div class="menu-card" id="menu-card">
      <div class="menu-titre">🍽 Menus</div>
      <div id="menu-contenu"><div class="menu-ligne menu-vide">Chargement...</div></div>
    </div>
    <div id="liste-taches"><div class="vide">Chargement...</div></div>
  </div>

  <!-- Vue Courses -->
  <div class="vue" id="vue-courses">
    <div class="resume" id="courses-resume"></div>
    <div id="formulaire-courses"></div>
    <div id="liste-courses"><div class="vide">Chargement...</div></div>
    <button class="btn-ajouter" onclick="ouvrirCourse(-1)">+ Ajouter un article</button>
    <button class="btn-secondaire" id="btn-retirer-pris" style="display:none" onclick="retirerPris()"></button>
  </div>

  <!-- Vue Projets -->
  <div class="vue" id="vue-projets">
    <div class="seg">
      <button id="seg-projet" class="active" onclick="setModeProjets('projet')">Par projet</button>
      <button id="seg-jour" onclick="setModeProjets('jour')">Par jour</button>
    </div>
    <div id="formulaire-projets"></div>
    <div id="liste-projets"><div class="vide">Chargement...</div></div>
    <button class="btn-ajouter" onclick="ouvrirProjet(-1, '')">+ Ajouter une sous-tâche</button>
    <datalist id="liste-noms-projets"></datalist>
  </div>

  <!-- Vue Gérer -->
  <div class="vue" id="vue-gerer">
    <div class="jours" id="selecteur-jours"></div>
    <div id="formulaire-container"></div>
    <div id="liste-gestion"><div class="vide">Chargement...</div></div>
    <button class="btn-ajouter" onclick="ouvrirFormulaire()">+ Ajouter une tâche</button>
  </div>

  <!-- Vue Plateau -->
  <div class="vue plateau-vue" id="vue-plateau">
    <div class="retro-wrap" id="retro-wrap">
      <canvas class="confetti-canvas" id="confetti-canvas"></canvas>
      <div class="retro-header-block">
        <div class="retro-title">RUN BLUE</div>
        <div class="retro-score" id="plateau-score">—</div>
        <div class="retro-sub">points cumulés</div>
        <div class="retro-next" id="plateau-next"></div>
      </div>
      <div class="month-toggle">
        <button class="month-btn active" id="btn30" onclick="setMonth(30)">30 jours</button>
        <button class="month-btn" id="btn31" onclick="setMonth(31)">31 jours</button>
      </div>
      <div class="grid-wrap" id="plateau-grid"></div>
      <div class="palier-cards" id="palier-cards"></div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav">
    <button class="nav-btn active" onclick="allerVue('aujourd-hui', this)">
      <span class="nav-icon">☑</span>
      Aujourd'hui
    </button>
    <button class="nav-btn" onclick="allerVue('courses', this)">
      <span class="nav-icon">🛒</span>
      Courses
    </button>
    <button class="nav-btn" onclick="allerVue('projets', this)">
      <span class="nav-icon">📋</span>
      Projets
    </button>
    <button class="nav-btn" onclick="allerVue('gerer', this)">
      <span class="nav-icon">✏</span>
      Gérer
    </button>
    <button class="nav-btn" onclick="allerVue('plateau', this)">
      <span class="nav-icon">🎮</span>
      Plateau
    </button>
  </nav>

  <script>
    const CLIENT_ID = '839214144593-sipnckscvoa5rcpeni5u9nlcakvv70i7.apps.googleusercontent.com';
    const SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
    // Si tu as importé le nouveau classeur comme NOUVEAU fichier Google Sheets, remplace cet identifiant.
    const SHEET_ID = '1F_7WzFvqzA_EO_FJ6orefaUd1_zeKkUIKMz4YpT4oJQ';
    const API = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID;

    const PALIERS = { 30:[30,60,90,120,135,150], 31:[31,62,93,124,140,155] };
    const TOTAL_CASES = { 30:150, 31:155 };
    const CELEBRATED_KEY = 'runblue_celebrated_v2';
    const CONFETTI_COLORS = ['#7c3aed','#9f67fa','#4a9fd4','#c084fc','#60a5fa','#ffffff'];

    const CATEGORIES = ['Me','House','Job','Study','Luna','Sport','Friends','Family','Administratif'];
    const COULEURS = { Me:'#185FA5', Luna:'#E8760A', House:'#1A7F5A', Job:'#6B3FA0', Study:'#0891B2', Sport:'#059669', Friends:'#B5338A', Family:'#B45309', Administratif:'#555555', '':'#999999' };
    const RAYONS = ['Fruits et légumes','Frais','Épicerie','Boucherie / Poisson','Boulangerie','Surgelés','Boissons','Maison / Hygiène','Luna','Autre'];

    const N_AUTO = 10;   // lignes automatiques par jour dans Objectifs (les 5 suivantes sont manuelles)
    const N_LIGNES = 15; // lignes de tâches par jour

    let jourSelectionne = new Date().getDate();
    let modeFormulaire = null;
    let ligneModif = null;
    let monthMode = 30;
    let plateauScore = 0;
    let plateauRewards = {};
    let confettiAnim = null;
    let confettiParticles = [];

    let gestionData = [];
    let coursesData = [];
    let courseEdit = -1;
    let projetsData = [];
    let projetEdit = -1;
    let modeProjets = 'projet';

    // ── Utilitaires ──────────────────────────────────────

    function getToken() { return localStorage.getItem('token'); }
    function ligneDepart(jour) { return 5 + (jour - 1) * 18; }
    function esc(s) {
      return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    function estVrai(v) { return v === true || v === 'TRUE' || v === 'VRAI'; }
    function joursDansMois() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }

    function getCelebrated() {
      try { return JSON.parse(localStorage.getItem(CELEBRATED_KEY) || '[]'); } catch(e) { return []; }
    }
    function cleFete(p) { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + p; }
    function markCelebrated(cle) {
      const l = getCelebrated();
      if (!l.includes(cle)) { l.push(cle); localStorage.setItem(CELEBRATED_KEY, JSON.stringify(l)); }
    }

    function connexion() {
      const url = 'https://accounts.google.com/o/oauth2/v2/auth'
        + '?client_id=' + CLIENT_ID
        + '&redirect_uri=' + encodeURIComponent('https://malypo.github.io/runblue/')
        + '&response_type=token'
        + '&scope=' + encodeURIComponent(SCOPE);
      window.location.href = url;
    }

    function afficherDate() {
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('header-date').textContent =
        new Date().toLocaleDateString('fr-FR', options);
    }

    // ── Accès à Google Sheets ────────────────────────────

    function sessionExpiree() {
      localStorage.removeItem('token');
      document.getElementById('btn-co').style.display = 'block';
    }

    async function sheetsFetch(chemin, options) {
      const token = getToken();
      if (!token) { sessionExpiree(); throw new Error('no-token'); }
      const opts = options || {};
      const res = await fetch(API + chemin, {
        method: opts.method || 'GET',
        headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: opts.body
      });
      if (res.status === 401) { sessionExpiree(); throw new Error('401'); }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function lire(plage, extra) {
      const d = await sheetsFetch('/values/' + encodeURIComponent(plage) + (extra ? '?' + extra : ''));
      return d.values || [];
    }

    async function ecrire(plage, valeurs) {
      return sheetsFetch('/values/' + encodeURIComponent(plage) + '?valueInputOption=RAW', {
        method: 'PUT',
        body: JSON.stringify({ range: plage, majorDimension: 'ROWS', values: valeurs })
      });
    }

    async function ecrireLot(data) {
      return sheetsFetch('/values:batchUpdate', {
        method: 'POST',
        body: JSON.stringify({ valueInputOption: 'RAW', data: data })
      });
    }

    function erreurHtml(e) {
      if (e && (e.message === '401' || e.message === 'no-token')) return '<div class="vide">Session expirée. Reconnectez-vous.</div>';
      return '<div class="vide">Impossible de charger les données (' + esc(e && e.message) + '). Vérifie que l\'onglet existe dans le Sheet.</div>';
    }

    // ── Navigation ───────────────────────────────────────

    function allerVue(nom, btn) {
      document.querySelectorAll('.vue').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('vue-' + nom).classList.add('active');
      btn.classList.add('active');
      if (nom === 'aujourd-hui') { chargerTaches(); chargerMenu(); }
      if (nom === 'courses') chargerCourses();
      if (nom === 'projets') chargerProjets();
      if (nom === 'gerer') chargerGestion(jourSelectionne);
      if (nom === 'plateau') chargerPlateau();

    // ── Vue Aujourd'hui : menus (aujourd'hui et demain) ──

    async function chargerMenu() {
      const zone = document.getElementById('menu-contenu');
      if (!getToken()) { zone.innerHTML = '<div class="menu-ligne menu-vide">Connectez-vous pour voir le menu.</div>'; return; }
      try {
        const rows = await lire('Menus!A2:C8');
        const idxAujourdhui = (new Date().getDay() + 6) % 7; // lundi = 0
        const idxDemain = (idxAujourdhui + 1) % 7;           // dimanche -> lundi

        const ligne = (label, val) => {
          const v = (val || '').toString().trim();
          return `<div class="menu-ligne"><div class="menu-moment">${label}</div><div class="${v ? '' : 'menu-vide'}">${v ? esc(v) : 'Non renseigné'}</div></div>`;
        };
        const bloc = (titre, idx) => {
          const r = rows[idx] || [];
          return `<div class="menu-jour">${titre}</div>` + ligne('Midi', r[1]) + ligne('Soir', r[2]);
        };

        zone.innerHTML = bloc('Aujourd\'hui', idxAujourdhui)
                       + '<div class="menu-sep"></div>'
                       + bloc('Demain', idxDemain);
      } catch (e) {
        zone.innerHTML = '<div class="menu-ligne menu-vide">Menu indisponible.</div>';
      }

    // ── Vue Aujourd'hui : tâches ─────────────────────────

    async function chargerTaches() {
      const liste = document.getElementById('liste-taches');
      if (!getToken()) {
        document.getElementById('btn-co').style.display = 'block';
        liste.innerHTML = '<div class="vide">Connectez-vous pour voir vos tâches.</div>';
        return;
      }
      const jour = new Date().getDate();
      const debut = ligneDepart(jour) + 1;
      try {
        const rows = await lire(`Objectifs!A${debut}:D${debut + N_LIGNES - 1}`);
        afficherTaches(rows, debut);
      } catch (e) {
        liste.innerHTML = erreurHtml(e);
      }
    }

    function afficherTaches(rows, ligneDebut) {
      const liste = document.getElementById('liste-taches');
      const taches = rows
        .map((r, i) => ({
          coche: estVrai(r[0]),
          cat: r[1] || '', nom: r[2] || '', note: r[3] || '',
          ligneSheet: ligneDebut + i
        }))
        .filter(t => t.nom.trim() !== '');

      if (taches.length === 0) {
        document.getElementById('header-pct').textContent = '';
        liste.innerHTML = '<div class="vide">Aucune tâche pour aujourd\'hui.</div>';
        return;
      }

      const total = taches.length;
      const cochees = taches.filter(t => t.coche).length;
      const pct = Math.round((cochees / total) * 100);
      document.getElementById('header-pct').textContent = `${cochees}/${total} tâches — ${pct}%`;

      const ordre = ['Me','Luna','House','Job','Study','Sport','Friends','Family','Administratif',''];

      const groupes = {};
      for (const cat of ordre) groupes[cat] = [];
      for (const t of taches) {
        const cat = ordre.includes(t.cat) ? t.cat : '';
        groupes[cat].push(t);
      }

      let html = '';
      for (const cat of ordre) {
        if (groupes[cat].length === 0) continue;
        const couleur = COULEURS[cat] || '#999';
        html += `<div class="groupe-titre" style="background:${couleur}">${cat || 'Autre'}</div>`;
        html += groupes[cat].map(t => `
          <div class="tache" onclick="basculer(${t.ligneSheet}, this)">
            <div class="check ${t.coche ? 'done' : ''}"></div>
            <div class="tache-info">
              <div class="tache-nom ${t.coche ? 'done' : ''}">${esc(t.nom)}</div>
              ${t.note ? `<div class="tache-note">${esc(t.note)}</div>` : ''}
            </div>
          </div>`).join('');
      }
      liste.innerHTML = html;
    }

    async function basculer(ligneSheet, el) {
      const check = el.querySelector('.check');
      const nom = el.querySelector('.tache-nom');
      const estCoche = check.classList.contains('done');
      const nouvelleValeur = !estCoche;
      check.classList.toggle('done', nouvelleValeur);
      nom.classList.toggle('done', nouvelleValeur);
      const taches = document.querySelectorAll('#liste-taches .tache');
      const total = taches.length;
      const cochees = document.querySelectorAll('#liste-taches .check.done').length;
      const pct = Math.round((cochees / total) * 100);
      document.getElementById('header-pct').textContent = `${cochees}/${total} tâches — ${pct}%`;
      try {
        await ecrire(`Objectifs!A${ligneSheet}`, [[nouvelleValeur]]);
      } catch (e) {
        check.classList.toggle('done', estCoche);
        nom.classList.toggle('done', estCoche);
        alert('La modification n\'a pas pu être enregistrée. Vérifie ta connexion.');
        chargerTaches();
      }
    }

    // ── Vue Courses ──────────────────────────────────────

    async function chargerCourses() {
      const liste = document.getElementById('liste-courses');
      if (!getToken()) {
        document.getElementById('btn-co').style.display = 'block';
        liste.innerHTML = '<div class="vide">Connectez-vous pour voir la liste.</div>';
        return;
      }
      try {
        const rows = await lire('Courses!A2:E101');
        coursesData = [];
        for (let i = 0; i < 100; i++) {
          const r = rows[i] || [];
          const article = (r[1] === undefined || r[1] === null) ? '' : String(r[1]).trim();
          if (!article) continue;
          coursesData.push({ ligne: 2 + i, pris: estVrai(r[0]), article: article, qte: r[2] || '', rayon: r[3] || '', note: r[4] || '' });
        }
        afficherCourses();
      } catch (e) {
        liste.innerHTML = erreurHtml(e);
      }
    }

    function afficherCourses() {
      const liste = document.getElementById('liste-courses');
      const nbPris = coursesData.filter(c => c.pris).length;
      const nbReste = coursesData.length - nbPris;
      document.getElementById('courses-resume').textContent =
        coursesData.length ? `${nbReste} à acheter · ${nbPris} pris` : '';
      const btn = document.getElementById('btn-retirer-pris');
      btn.style.display = nbPris > 0 ? 'block' : 'none';
      btn.textContent = `Retirer ${nbPris > 1 ? 'les ' + nbPris + ' articles pris' : 'l\'article pris'}`;

      if (coursesData.length === 0) {
        liste.innerHTML = '<div class="vide">La liste est vide.</div>';
        return;
      }
      const groupes = {};
      coursesData.forEach((c, i) => {
        const k = RAYONS.includes(c.rayon) ? c.rayon : '';
        (groupes[k] = groupes[k] || []).push(i);
      });
      let html = '';
      for (const k of RAYONS.concat([''])) {
        if (!groupes[k]) continue;
        const idxs = groupes[k].slice().sort((a, b) => Number(coursesData[a].pris) - Number(coursesData[b].pris));
        html += `<div class="groupe-titre" style="background:#555">${esc(k || 'Sans rayon')}</div>`;
        html += idxs.map(i => {
          const c = coursesData[i];
          return `
          <div class="tache">
            <div class="check ${c.pris ? 'done' : ''}" onclick="basculerCourse(${i})"></div>
            <div class="tache-info" onclick="basculerCourse(${i})">
              <div class="tache-nom ${c.pris ? 'done' : ''}">${esc(c.article)}${c.qte ? `<span class="qte">${esc(c.qte)}</span>` : ''}</div>
              ${c.note ? `<div class="tache-note">${esc(c.note)}</div>` : ''}
            </div>
            <button class="btn-ic" onclick="ouvrirCourse(${i})" aria-label="Modifier">✎</button>
            <button class="btn-ic del" onclick="supprimerCourse(${i})" aria-label="Supprimer">✕</button>
          </div>`;
        }).join('');
      }
      liste.innerHTML = html;
    }

    async function basculerCourse(i) {
      const c = coursesData[i];
      c.pris = !c.pris;
      afficherCourses();
      try {
        await ecrire(`Courses!A${c.ligne}`, [[c.pris]]);
      } catch (e) {
        c.pris = !c.pris;
        afficherCourses();
        alert('La modification n\'a pas pu être enregistrée.');
      }
    }

    function ouvrirCourse(i) {
      courseEdit = i;
      const c = i >= 0 ? coursesData[i] : { article: '', qte: '', rayon: '', note: '' };
      document.getElementById('formulaire-courses').innerHTML = `
        <div class="formulaire">
          <h3>${i >= 0 ? 'Modifier l\'article' : 'Ajouter un article'}</h3>
          <div class="champ"><label>Article</label>
            <input type="text" id="c-article" value="${esc(c.article)}" placeholder="Ex: Tomates" /></div>
          <div class="champ"><label>Quantité (optionnel)</label>
            <input type="text" id="c-qte" value="${esc(c.qte)}" placeholder="Ex: 1 kg" /></div>
          <div class="champ"><label>Rayon</label>
            <select id="c-rayon"><option value="">— Aucun —</option>
              ${RAYONS.map(r => `<option value="${esc(r)}" ${c.rayon === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}
            </select></div>
          <div class="champ"><label>Note (optionnel)</label>
            <input type="text" id="c-note" value="${esc(c.note)}" placeholder="Ex: marque préférée" /></div>
          <div class="form-actions">
            <button class="btn-cancel" onclick="fermerCourse()">Annuler</button>
            <button class="btn-save" onclick="sauvegarderCourse()">Enregistrer</button>
          </div>
        </div>`;
      document.getElementById('c-article').focus();
    }

    function fermerCourse() {
      document.getElementById('formulaire-courses').innerHTML = '';
      courseEdit = -1;
    }

    async function sauvegarderCourse() {
      const article = document.getElementById('c-article').value.trim();
      const qte = document.getElementById('c-qte').value.trim();
      const rayon = document.getElementById('c-rayon').value;
      const note = document.getElementById('c-note').value.trim();
      if (!article) { alert('Le nom de l\'article est obligatoire.'); return; }
      let ligne, pris = false;
      if (courseEdit >= 0) {
        ligne = coursesData[courseEdit].ligne;
        pris = coursesData[courseEdit].pris;
      } else {
        const occupees = new Set(coursesData.map(c => c.ligne));
        for (let l = 2; l <= 101; l++) if (!occupees.has(l)) { ligne = l; break; }
        if (!ligne) { alert('La liste est pleine (100 articles max). Retire les articles pris.'); return; }
      }
      try {
        await ecrire(`Courses!A${ligne}:E${ligne}`, [[pris, article, qte, rayon, note]]);
      } catch (e) { alert('L\'article n\'a pas pu être enregistré.'); return; }
      fermerCourse();
      chargerCourses();
    }

    async function supprimerCourse(i) {
      const c = coursesData[i];
      if (!confirm('Supprimer « ' + c.article + ' » ?')) return;
      try {
        await ecrire(`Courses!A${c.ligne}:E${c.ligne}`, [[false, '', '', '', '']]);
      } catch (e) { alert('La suppression a échoué.'); return; }
      chargerCourses();
    }

    async function retirerPris() {
      const pris = coursesData.filter(c => c.pris);
      if (pris.length === 0) return;
      if (!confirm('Retirer ' + pris.length + ' article(s) pris de la liste ?')) return;
      try {
        await ecrireLot(pris.map(c => ({ range: `Courses!A${c.ligne}:E${c.ligne}`, values: [[false, '', '', '', '']] })));
      } catch (e) { alert('Le nettoyage a échoué.'); return; }
      chargerCourses();
    }

    // ── Vue Projets ──────────────────────────────────────

    function serialVersIso(n) {
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
      return d.toISOString().slice(0, 10);
    }
    function isoVersSerial(iso) {
      const p = iso.split('-').map(Number);
      return Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(1899, 11, 30)) / 86400000);
    }
    function isoAujourdhui(decalage) {
      const d = new Date();
      d.setDate(d.getDate() + (decalage || 0));
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function libelleDate(iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    function lireDate(v) {
      if (typeof v === 'number') return serialVersIso(v);
      if (typeof v === 'string') {
        const s = v.trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
      }
      return '';
    }

    function setModeProjets(m) {
      modeProjets = m;
      document.getElementById('seg-projet').classList.toggle('active', m === 'projet');
      document.getElementById('seg-jour').classList.toggle('active', m === 'jour');
      afficherProjets();
    }

    async function chargerProjets() {
      const liste = document.getElementById('liste-projets');
      if (!getToken()) {
        document.getElementById('btn-co').style.display = 'block';
        liste.innerHTML = '<div class="vide">Connectez-vous pour voir vos projets.</div>';
        return;
      }
      try {
        const rows = await lire('Projets!A2:E101', 'valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER');
        projetsData = [];
        for (let i = 0; i < 100; i++) {
          const r = rows[i] || [];
          const nom = (r[2] === undefined || r[2] === null) ? '' : String(r[2]).trim();
          if (!nom) continue;
          projetsData.push({
            ligne: 2 + i,
            projet: (r[0] === undefined || r[0] === null || String(r[0]).trim() === '') ? 'Sans projet' : String(r[0]).trim(),
            cat: r[1] || '',
            nom: nom,
            date: lireDate(r[3]),
            fait: estVrai(r[4])
          });
        }
        afficherProjets();
      } catch (e) {
        liste.innerHTML = erreurHtml(e);
      }
    }

    function ligneSousTache(i, mode) {
      const p = projetsData[i];
      const aujourdhui = isoAujourdhui(0);
      let meta = '';
      if (mode === 'projet') {
        if (p.date) {
          const cls = (!p.fait && p.date < aujourdhui) ? 'retard' : (p.date === aujourdhui ? 'today' : '');
          meta = `<span class="chip ${cls}">${esc(libelleDate(p.date))}</span>`;
        } else {
          meta = '<span class="chip">À planifier</span>';
        }
      } else {
        meta = `<span class="chip" style="background:${COULEURS[p.cat] || COULEURS['']};color:white">${esc(p.projet)}</span>`;
      }
      return `
        <div class="sous-tache">
          <div class="check ${p.fait ? 'done' : ''}" onclick="basculerProjet(${i})"></div>
          <div class="tache-info" onclick="basculerProjet(${i})">
            <div class="tache-nom ${p.fait ? 'done' : ''}">${esc(p.nom)}</div>
            <div>${meta}</div>
          </div>
          <button class="btn-ic" onclick="ouvrirProjet(${i}, '')" aria-label="Modifier">✎</button>
          <button class="btn-ic del" onclick="supprimerProjet(${i})" aria-label="Supprimer">✕</button>
        </div>`;
    }

    function afficherProjets() {
      const liste = document.getElementById('liste-projets');
      document.getElementById('liste-noms-projets').innerHTML =
        [...new Set(projetsData.map(p => p.projet).filter(n => n !== 'Sans projet'))].map(n => `<option value="${esc(n)}">`).join('');

      if (projetsData.length === 0) {
        liste.innerHTML = '<div class="vide">Aucune sous-tâche pour le moment.</div>';
        return;
      }
      const aujourdhui = isoAujourdhui(0);

      if (modeProjets === 'projet') {
        const ordre = [];
        const parProjet = {};
        projetsData.forEach((p, i) => {
          if (!parProjet[p.projet]) { parProjet[p.projet] = []; ordre.push(p.projet); }
          parProjet[p.projet].push(i);
        });
        liste.innerHTML = ordre.map(nom => {
          const idxs = parProjet[nom].slice().sort((a, b) => {
            const pa = projetsData[a], pb = projetsData[b];
            if (pa.fait !== pb.fait) return pa.fait ? 1 : -1;
            if (pa.date && pb.date) return pa.date < pb.date ? -1 : (pa.date > pb.date ? 1 : 0);
            if (pa.date) return -1;
            if (pb.date) return 1;
            return 0;
          });
          const total = idxs.length;
          const faits = idxs.filter(i => projetsData[i].fait).length;
          const pct = Math.round(faits / total * 100);
          const cat = projetsData[idxs[0]].cat;
          return `
          <div class="projet-card">
            <div class="projet-top">
              <div>
                <div class="projet-nom">${esc(nom)}</div>
                ${cat ? `<span class="badge" style="background:${COULEURS[cat] || COULEURS['']}">${esc(cat)}</span>` : ''}
              </div>
              <button class="btn-mini" onclick="ouvrirProjet(-1, ${idxs[0]})">+ Sous-tâche</button>
            </div>
            <div class="progress"><div style="width:${pct}%"></div></div>
            <div class="progress-txt">${faits}/${total} terminées · ${pct}%</div>
            ${idxs.map(i => ligneSousTache(i, 'projet')).join('')}
          </div>`;
        }).join('');
        return;
      }

      // Mode "Par jour"
      const groupes = { retard: [], sans: [] };
      const dates = {};
      projetsData.forEach((p, i) => {
        if (!p.date) { if (!p.fait) groupes.sans.push(i); return; }
        if (p.date < aujourdhui) {
          if (!p.fait) groupes.retard.push(i);   // les sous-tâches passées et terminées ne sont pas listées ici
          return;
        }
        (dates[p.date] = dates[p.date] || []).push(i);
      });
      let html = '';
      const bloc = (titre, idxs, cls) => {
        if (!idxs.length) return '';
        return `<div class="jour-titre ${cls || ''}">${esc(titre)}</div>` + idxs.map(i => ligneSousTache(i, 'jour')).join('');
      };
      html += bloc('En retard', groupes.retard, 'retard');
      Object.keys(dates).sort().forEach(d => {
        let titre = libelleDate(d);
        if (d === aujourdhui) titre = 'Aujourd\'hui · ' + titre;
        else if (d === isoAujourdhui(1)) titre = 'Demain · ' + titre;
        html += bloc(titre, dates[d]);
      });
      html += bloc('À planifier', groupes.sans);
      liste.innerHTML = html || '<div class="vide">Rien de prévu. Toutes les sous-tâches planifiées sont terminées.</div>';
    }

    async function basculerProjet(i) {
      const p = projetsData[i];
      p.fait = !p.fait;
      afficherProjets();
      try {
        await ecrire(`Projets!E${p.ligne}`, [[p.fait]]);
      } catch (e) {
        p.fait = !p.fait;
        afficherProjets();
        alert('La modification n\'a pas pu être enregistrée.');
      }
    }

    // i >= 0 : modifier la sous-tâche i. i = -1 : ajouter, avec modele = index d'une sous-tâche du même projet (ou '')
    function ouvrirProjet(i, modele) {
      projetEdit = i;
      let p = { projet: '', cat: '', nom: '', date: '' };
      if (i >= 0) p = projetsData[i];
      else if (modele !== '' && projetsData[modele]) p = { projet: projetsData[modele].projet, cat: projetsData[modele].cat, nom: '', date: '' };
      if (p.projet === 'Sans projet') p.projet = '';
      document.getElementById('formulaire-projets').innerHTML = `
        <div class="formulaire">
          <h3>${i >= 0 ? 'Modifier la sous-tâche' : 'Ajouter une sous-tâche'}</h3>
          <div class="champ"><label>Projet</label>
            <input type="text" id="p-projet" list="liste-noms-projets" value="${esc(p.projet)}" placeholder="Ex: EllaDesCartes" onchange="majCatProjet()" /></div>
          <div class="champ"><label>Catégorie</label>
            <select id="p-cat"><option value="">— Aucune —</option>
              ${CATEGORIES.map(c => `<option value="${c}" ${p.cat === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select></div>
          <div class="champ"><label>Sous-tâche</label>
            <input type="text" id="p-nom" value="${esc(p.nom)}" placeholder="Ex: Préparer la maquette" /></div>
          <div class="champ"><label>Date prévue (optionnel)</label>
            <input type="date" id="p-date" value="${esc(p.date)}" /></div>
          <div class="form-actions">
            <button class="btn-cancel" onclick="fermerProjet()">Annuler</button>
            <button class="btn-save" onclick="sauvegarderProjet()">Enregistrer</button>
          </div>
        </div>`;
      document.getElementById('p-nom').focus();
    }

    function majCatProjet() {
      const nom = document.getElementById('p-projet').value.trim();
      const sel = document.getElementById('p-cat');
      if (sel.value) return;
      const ex = projetsData.find(p => p.projet === nom && p.cat);
      if (ex) sel.value = ex.cat;
    }

    function fermerProjet() {
      document.getElementById('formulaire-projets').innerHTML = '';
      projetEdit = -1;
    }

    async function sauvegarderProjet() {
      const projet = document.getElementById('p-projet').value.trim();
      const cat = document.getElementById('p-cat').value;
      const nom = document.getElementById('p-nom').value.trim();
      const date = document.getElementById('p-date').value;
      if (!projet) { alert('Le nom du projet est obligatoire.'); return; }
      if (!nom) { alert('Le nom de la sous-tâche est obligatoire.'); return; }
      let ligne, fait = false;
      if (projetEdit >= 0) {
        ligne = projetsData[projetEdit].ligne;
        fait = projetsData[projetEdit].fait;
      } else {
        const occupees = new Set(projetsData.map(p => p.ligne));
        for (let l = 2; l <= 101; l++) if (!occupees.has(l)) { ligne = l; break; }
        if (!ligne) { alert('Plus de place (100 sous-tâches max).'); return; }
      }
      try {
        await ecrire(`Projets!A${ligne}:E${ligne}`, [[projet, cat, nom, date ? isoVersSerial(date) : '', fait]]);
      } catch (e) { alert('La sous-tâche n\'a pas pu être enregistrée.'); return; }
      fermerProjet();
      chargerProjets();
    }

    async function supprimerProjet(i) {
      const p = projetsData[i];
      if (!confirm('Supprimer « ' + p.nom + ' » ?')) return;
      try {
        await ecrire(`Projets!A${p.ligne}:E${p.ligne}`, [['', '', '', '', false]]);
      } catch (e) { alert('La suppression a échoué.'); return; }
      chargerProjets();
    }

    // ── Vue Gérer ────────────────────────────────────────
    // Les 10 premières lignes de chaque jour sont automatiques (onglet Tâches du Sheet).
    // Seules les 5 dernières sont modifiables ici.

    function construireSeleteurJours() {
      const aujourd = new Date().getDate();
      const dernierJour = joursDansMois();
      const container = document.getElementById('selecteur-jours');
      container.innerHTML = '';
      for (let j = 1; j <= dernierJour; j++) {
        const btn = document.createElement('button');
        btn.className = 'jour-btn' + (j === aujourd ? ' today' : '') + (j === jourSelectionne ? ' active' : '');
        btn.textContent = j;
        btn.onclick = () => {
          jourSelectionne = j;
          document.querySelectorAll('.jour-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          fermerFormulaire();
          chargerGestion(j);
        };
        container.appendChild(btn);
      }
      setTimeout(() => {
        const actif = container.querySelector('.active');
        if (actif && actif.scrollIntoView) actif.scrollIntoView({ inline: 'center', behavior: 'smooth' });
      }, 100);
    }

    async function chargerGestion(jour) {
      const liste = document.getElementById('liste-gestion');
      if (!getToken()) {
        liste.innerHTML = '<div class="vide">Connectez-vous pour gérer vos tâches.</div>';
        return;
      }
      const debut = ligneDepart(jour) + 1;
      try {
        const rows = await lire(`Objectifs!A${debut}:D${debut + N_LIGNES - 1}`);
        afficherGestion(rows, debut);
      } catch (e) {
        liste.innerHTML = erreurHtml(e);
      }
    }

    function afficherGestion(rows, ligneDebut) {
      const liste = document.getElementById('liste-gestion');
      gestionData = [];
      for (let i = 0; i < N_LIGNES; i++) {
        const r = rows[i] || [];
        gestionData.push({
          ligne: ligneDebut + i, auto: i < N_AUTO, coche: estVrai(r[0]),
          cat: r[1] || '', nom: (r[2] || '').toString().trim(), note: r[3] || ''
        });
      }
      const affichees = gestionData.map((t, i) => ({ t, i })).filter(x => x.t.nom !== '');
      const info = '<div class="auto-info">Les tâches marquées « auto » viennent de l\'onglet Tâches du Sheet (quotidiennes, hebdo, mensuelles, annuelles). Ici, tu modifies les tâches propres à ce jour.</div>';
      if (affichees.length === 0) {
        liste.innerHTML = info + '<div class="vide">Aucune tâche ce jour.</div>';
        return;
      }
      liste.innerHTML = info + affichees.map(({ t, i }) => `
        <div class="tache-gestion ${t.auto ? 'auto' : ''}">
          <div class="tache-gestion-top">
            <div class="tache-info">
              <div class="tache-gestion-nom">${esc(t.nom)}${t.auto ? '<span class="tag-auto">auto</span>' : ''}</div>
              ${t.cat ? `<span class="badge" style="background:${COULEURS[t.cat] || COULEURS['']}">${esc(t.cat)}</span>` : ''}
              ${t.note ? `<div class="tache-gestion-note">${esc(t.note)}</div>` : ''}
            </div>
            ${t.auto ? '' : `
            <div class="tache-actions">
              <button class="btn-edit" onclick="ouvrirModif(${i})">Modifier</button>
              <button class="btn-del" onclick="supprimerTache(${i})">Supprimer</button>
            </div>`}
          </div>
        </div>`).join('');
    }

    function ouvrirFormulaire(nom, cat, note) {
      modeFormulaire = 'ajout'; ligneModif = null;
      afficherFormulaire('Ajouter une tâche', nom || '', cat || '', note || '');
    }
    function ouvrirModif(i) {
      const t = gestionData[i];
      modeFormulaire = 'modif'; ligneModif = i;
      afficherFormulaire('Modifier la tâche', t.nom, t.cat, t.note);
    }
    function afficherFormulaire(titre, nom, cat, note) {
      document.getElementById('formulaire-container').innerHTML = `
        <div class="formulaire">
          <h3>${titre}</h3>
          <div class="champ">
            <label>Tâche</label>
            <input type="text" id="f-nom" value="${esc(nom)}" placeholder="Ex: Laver le chien" />
          </div>
          <div class="champ">
            <label>Catégorie</label>
            <select id="f-cat">
              <option value="">— Aucune —</option>
              ${CATEGORIES.map(c => `<option value="${c}" ${cat === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </div>
          <div class="champ">
            <label>Note (optionnel)</label>
            <input type="text" id="f-note" value="${esc(note)}" placeholder="Ex: Avec le shampooing spécial" />
          </div>
          <div class="form-actions">
            <button class="btn-cancel" onclick="fermerFormulaire()">Annuler</button>
            <button class="btn-save" onclick="sauvegarderTache()">Enregistrer</button>
          </div>
        </div>`;
    }
    function fermerFormulaire() {
      document.getElementById('formulaire-container').innerHTML = '';
      modeFormulaire = null; ligneModif = null;
    }

    async function sauvegarderTache() {
      const nom = document.getElementById('f-nom').value.trim();
      const cat = document.getElementById('f-cat').value;
      const note = document.getElementById('f-note').value.trim();
      if (!nom) { alert('Le nom de la tâche est obligatoire.'); return; }
      let ligne, coche = false;
      try {
        if (modeFormulaire === 'ajout') {
          const debut = ligneDepart(jourSelectionne) + 1;
          const rows = await lire(`Objectifs!A${debut}:D${debut + N_LIGNES - 1}`);
          let indexVide = -1;
          for (let i = N_AUTO; i < N_LIGNES; i++) {
            const r = rows[i] || [];
            if (!r[2] || String(r[2]).trim() === '') { indexVide = i; break; }
          }
          if (indexVide === -1) { alert('Plus de place pour ce jour (' + (N_LIGNES - N_AUTO) + ' tâches propres au jour max).'); return; }
          ligne = debut + indexVide;
        } else {
          ligne = gestionData[ligneModif].ligne;
          coche = gestionData[ligneModif].coche;
        }
        await ecrire(`Objectifs!A${ligne}:D${ligne}`, [[coche, cat, nom, note]]);
      } catch (e) { alert('La tâche n\'a pas pu être enregistrée.'); return; }
      fermerFormulaire();
      chargerGestion(jourSelectionne);
    }

    async function supprimerTache(i) {
      if (!confirm('Supprimer cette tâche ?')) return;
      const t = gestionData[i];
      try {
        await ecrire(`Objectifs!A${t.ligne}:D${t.ligne}`, [[false, '', '', '']]);
      } catch (e) { alert('La suppression a échoué.'); return; }
      chargerGestion(jourSelectionne);
    }

    // ── Vue Plateau ──────────────────────────────────────
    // Le pion ne dépend que des tâches du quotidien (onglet Objectifs, via Recap). Les projets n'y comptent pas.

    function majBoutonsMois() {
      document.getElementById('btn30').classList.toggle('active', monthMode === 30);
      document.getElementById('btn31').classList.toggle('active', monthMode === 31);
    }

    function setMonth(m) {
      monthMode = m;
      majBoutonsMois();
      renderPlateau();
    }

    function buildSequence(total) {
      let num = 1, phase = 0;
      const rows = [];
      while (num <= total) {
        if (phase === 0) {
          const row = [];
          for (let c = 0; c < 10; c++) row.push(num <= total ? num++ : null);
          rows.push(row); phase = 1;
        } else if (phase === 1) {
          if (num > total) break;
          const row = new Array(10).fill(null);
          row[9] = num++; rows.push(row); phase = 2;
        } else if (phase === 2) {
          const nums = [];
          for (let c = 0; c < 10; c++) nums.push(num <= total ? num++ : null);
          nums.reverse(); rows.push(nums); phase = 3;
        } else if (phase === 3) {
          if (num > total) break;
          const row = new Array(10).fill(null);
          row[0] = num++; rows.push(row); phase = 0;
        }
      }
      return rows;
    }

    function renderPlateau() {
      const paliers = PALIERS[monthMode];
      const total = TOTAL_CASES[monthMode];
      const score = plateauScore;

      document.getElementById('plateau-score').textContent = score;
      const nextP = paliers.find(p => p > score);
      document.getElementById('plateau-next').textContent = nextP
        ? '> ' + (nextP - score) + ' cases avant le prochain palier'
        : '> tous les paliers atteints !';

      const wrap = document.getElementById('plateau-grid');
      wrap.innerHTML = '';
      const rows = buildSequence(total);

      rows.forEach(row => {
        row.forEach(num => {
          const div = document.createElement('div');
          if (num === null) {
            div.className = 'pcase pempty';
          } else {
            const isPalier = paliers.includes(num);
            const isCurrent = num === score;
            const isDone = num < score;
            const colorClass = num % 2 === 0 ? 'c2' : 'c1';
            let cls = 'pcase';
            if (isCurrent) {
              cls += ' current' + (isPalier ? ' palier' : '');
            } else if (isPalier) {
              cls += ' palier' + (isDone ? ' pdone' : '');
            } else {
              cls += isDone ? ' pdone' : (' ' + colorClass);
            }
            div.className = cls;
            div.textContent = isCurrent ? '★' : (isPalier ? '!' : num);
          }
          wrap.appendChild(div);
        });
      });

      renderPalierCards(paliers, score);

      const celebrated = getCelebrated();
      if (paliers.includes(score) && !celebrated.includes(cleFete(score))) {
        markCelebrated(cleFete(score));
        launchConfetti();
        setTimeout(() => showPopup(score), 300);
      }
    }

    function renderPalierCards(paliers, score) {
      const container = document.getElementById('palier-cards');
      container.innerHTML = '';
      for (const p of paliers) {
        const unlocked = score >= p;
        const reward = plateauRewards[p] || '';
        const card = document.createElement('div');
        card.className = 'palier-card' + (unlocked ? ' unlocked' : '');
        card.innerHTML = `
          <div class="palier-card-top">
            <div class="palier-badge ${unlocked ? 'unlocked' : ''}">Case ${p}</div>
            <div class="palier-card-title">${unlocked ? '>> DEBLOQUE' : '>> verrouille'}</div>
          </div>
          ${unlocked ? `
            <div class="palier-reward">${reward ? esc(reward) : '<span style="color:#7a8aaa">aucune récompense saisie</span>'}</div>
            <input class="reward-input" id="r-${p}" placeholder="Saisir ta récompense..." value="${esc(reward)}" />
            <button class="btn-save-reward" onclick="saveReward(${p})">Enregistrer</button>
            <div class="save-ok" id="ok-${p}">Sauvegarde OK !</div>
          ` : `<div style="font-size:7px;color:#7a8aaa;margin-top:4px;font-family:'Press Start 2P',monospace;">Atteins la case ${p} pour débloquer.</div>`}
        `;
        container.appendChild(card);
      }
    }

    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const wrap = document.getElementById('retro-wrap');
      canvas.width = wrap.offsetWidth; canvas.height = wrap.offsetHeight;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      confettiParticles = [];
      for (let i = 0; i < 80; i++) {
        confettiParticles.push({
          x: Math.random() * canvas.width, y: -10 - Math.random() * 80,
          w: 6 + Math.random() * 6, h: 8 + Math.random() * 6,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3,
          rot: Math.random() * 360, vr: (Math.random() - 0.5) * 8
        });
      }
      if (confettiAnim) cancelAnimationFrame(confettiAnim);
      let elapsed = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of confettiParticles) {
          p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.05;
          if (p.y < canvas.height + 20) alive = true;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
        }
        elapsed++;
        if (alive && elapsed < 180) confettiAnim = requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      draw();
    }

    function showPopup(palier) {
      const reward = plateauRewards[palier] || '';
      const wrap = document.getElementById('retro-wrap');
      document.querySelectorAll('.popup-overlay').forEach(e => e.remove());
      const overlay = document.createElement('div');
      overlay.className = 'popup-overlay';
      overlay.innerHTML = `
        <div class="popup-box">
          <div class="popup-fighting">Borahae !</div>
          <div class="popup-palier">> PALIER ${palier} ATTEINT</div>
          <div class="popup-reward">${reward ? esc(reward) : 'Saisis ta récompense ci-dessous !'}</div>
          <button class="popup-close" onclick="this.closest('.popup-overlay').remove()">CONTINUER</button>
        </div>
      `;
      wrap.appendChild(overlay);
    }

    async function saveReward(palier) {
      const val = document.getElementById('r-' + palier).value.trim();
      plateauRewards[palier] = val;
      if (getToken()) {
        const rowMap = { 30:{30:2,60:3,90:4,120:5,135:6,150:7}, 31:{31:2,62:3,93:4,124:5,140:6,155:7} };
        const row = (rowMap[monthMode] || {})[palier];
        if (row) {
          try { await ecrire(`Recompenses!B${row}`, [[val]]); } catch (e) {}
        }
      }
      const ok = document.getElementById('ok-' + palier);
      ok.style.display = 'block';
      setTimeout(() => ok.style.display = 'none', 2000);
      renderPlateau();
    }

    async function chargerPlateau() {
      if (!getToken()) return;
      try {
        const scoreRows = await lire('Recap!D7:D37');
        let score = 0;
        for (const row of scoreRows) if (row[0]) score = parseInt(row[0]) || 0;
        plateauScore = score;
      } catch (e) {}

      try {
        const rwRows = await lire('Recompenses!A2:B7');
        for (const row of rwRows) if (row[0] && row[1]) plateauRewards[parseInt(row[0])] = row[1];
      } catch (e) {}

      renderPlateau();
    }

    // ── Initialisation ───────────────────────────────────

    window.onload = function() {
      const hash = window.location.hash;
      if (hash.includes('access_token')) {
        const token = new URLSearchParams(hash.substring(1)).get('access_token');
        localStorage.setItem('token', token);
        window.location.hash = '';
      }
      afficherDate();
      monthMode = joursDansMois() === 31 ? 31 : 30;
      majBoutonsMois();
      chargerTaches();
      chargerMenu();
      construireSeleteurJours();
    };
  </script>
